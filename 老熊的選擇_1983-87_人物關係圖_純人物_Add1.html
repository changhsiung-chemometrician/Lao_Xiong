    for(const off of [0,-17,17,-32,32,-48,48]){
      const q=bez(p0,p1,p2,t);
      const box={x:q.x-uy*off-w/2,y:q.y+ux*off-h/2,w,h};
      let sc=0;
      obstacles.forEach(o=>sc+=ov(box,o)*1.4);
      placed.forEach(o=>sc+=ov(box,o)*2.2);
      sc+=Math.abs(t-.5)*260+Math.abs(off)*3;
      if(!best||sc<best.sc)best={sc,box,q:{x:q.x-uy*off,y:q.y+ux*off},anchor:q};
    }
  }
  placed.push(best.box);

  const g=el('g',{class:'edgegrp'});
  const p=el('path',{class:'edge',d:`M${p0.x.toFixed(1)},${p0.y.toFixed(1)} Q${p1.x.toFixed(1)},${p1.y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`,
    stroke:col,'stroke-width':main?5:2.2,'stroke-opacity':main?.95:.62});
  if(flag==='dash')p.setAttribute('stroke-dasharray','9 8');
  if(flag==='maindash')p.setAttribute('stroke-dasharray','0.1 16');
  const ax=p2.x-p1.x, ay=p2.y-p1.y, aL=Math.hypot(ax,ay)||1, vx=ax/aL, vy=ay/aL;
  g.append(p, el('path',{d:`M${p2.x},${p2.y} L${(p2.x-vx*15-vy*6.5).toFixed(1)},${(p2.y-vy*15+vx*6.5).toFixed(1)} L${(p2.x-vx*15+vy*6.5).toFixed(1)},${(p2.y-vy*15-vx*6.5).toFixed(1)} Z`,
    fill:col,'fill-opacity':.9}));
  gEdges.appendChild(g);

  const lg=el('g',{class:'edgelab'});
  const q=best.q, a=best.anchor;
  if(Math.hypot(q.x-a.x,q.y-a.y)>3)
    lg.appendChild(el('line',{class:'leader',x1:a.x.toFixed(1),y1:a.y.toFixed(1),x2:q.x.toFixed(1),y2:q.y.toFixed(1),stroke:col}));
  lg.appendChild(el('rect',{x:(q.x-w/2).toFixed(1),y:(q.y-h/2).toFixed(1),width:w.toFixed(1),height:h,rx:12,
    fill:main?'#ffdcee':'#d3e2f9',stroke:col,'stroke-width':main?1.8:1.1,'stroke-opacity':.85}));
  const tx=el('text',{class:'elabel',x:q.x.toFixed(1),y:(q.y+.5).toFixed(1)});
  tx.textContent=label; lg.appendChild(tx);
  gLabels.appendChild(lg);

  edgeEls[i]={g,lg,sid,tid,cat,label};
  adj[sid].push({other:tid,label,cat});
  adj[tid].push({other:sid,label,cat});
});

NODES.forEach(n=>{
  const r=R(n);
  const g=el('g',{class:'node',tabindex:'0',role:'button','aria-label':n.name});
  g.appendChild(el('circle',{cx:n.x,cy:n.y,r:r+16,fill:n.gate?'#ff86bd':'#5aa0ff',
    'fill-opacity':n.lead?.16:(n.gate?.12:.07)}));
  g.appendChild(el('circle',{class:'ring',cx:n.x,cy:n.y,r:r,
    fill:n.lead?'url(#faceLead)':(n.gate?'url(#faceGate)':(n.scene?'url(#faceScene)':'url(#face)')),
    stroke:n.lead?'#ffd07a':(n.gate?'#ff9ecb':(n.scene?'#5fd8bd':'#78b4ff')),
    'stroke-width':n.lead?3.5:(n.gate?3:2),'stroke-dasharray':n.scene?'6 5':''}));
  const gl=el('text',{class:'glyph',x:n.x,y:n.y,'font-size':n.lead?42:(n.gate?36:(n.scene?26:30))});
  gl.textContent=n.g; g.appendChild(gl);
  const nm=el('text',{class:'nname',x:n.x,y:n.y+r+28,'font-size':nameFS(n)});
  nm.textContent=n.name; g.appendChild(nm);
  const rl=el('text',{class:'nrole',x:n.x,y:n.y+r+48});
  rl.textContent=n.role; g.appendChild(rl);
  if(n.lead||n.gate){
    const bw=n.lead?38:52;
    g.appendChild(el('rect',{x:n.x+r-bw/2+8,y:n.y+r-22,width:bw,height:30,rx:15,
      fill:n.lead?'#f0904a':'#c2427f',stroke:n.lead?'#ffd7b0':'#ffbedb','stroke-width':1.5}));
    const b=el('text',{x:n.x+r+8,y:n.y+r-7,'font-size':n.lead?14:13.5,fill:'#fff','font-weight':800,
      'text-anchor':'middle','dominant-baseline':'central'});
    b.textContent=n.lead?'主角':n.gate; g.appendChild(b);
  }
  g.addEventListener('click',ev=>{ev.stopPropagation();focusNode(n.id);});
  g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();focusNode(n.id);}});
  gNodes.appendChild(g); nodeEls[n.id]=g;
});

/* ---------------- focus + panel ---------------- */
const panel=document.getElementById('panel');
function focusNode(id){
  const keep=new Set([id,...adj[id].map(a=>a.other)]);
  NODES.forEach(n=>nodeEls[n.id].classList.toggle('faded',!keep.has(n.id)));
  edgeEls.forEach(e=>{const on=e.sid===id||e.tid===id;
    e.g.classList.toggle('faded',!on); e.lg.classList.toggle('faded',!on);});
  const n=byId[id];
  document.getElementById('pName').textContent=n.name;
  document.getElementById('pRole').textContent=n.role;
  document.getElementById('pEra').textContent=n.era||'';
  const ul=document.getElementById('pFacts'); ul.innerHTML='';
  n.facts.forEach(f=>{const li=document.createElement('li');li.textContent=f;ul.appendChild(li);});
  const rd=document.getElementById('pRels'); rd.innerHTML='';
  adj[id].forEach(a=>{
    const d=document.createElement('div'); d.className='rel';
    d.innerHTML='<span class="bar" style="background:'+CAT[a.cat].c+'"></span>'+
      '<span class="who">'+byId[a.other].name+'</span><span class="what">・'+a.label+'</span>';
    d.onclick=()=>focusNode(a.other); rd.appendChild(d);
  });
  panel.classList.add('open'); panel.scrollTop=0;
}
function clearFocus(){
  panel.classList.remove('open');
  NODES.forEach(n=>nodeEls[n.id].classList.remove('faded'));
  edgeEls.forEach(e=>{e.g.classList.remove('faded');e.lg.classList.remove('faded');});
  applyFilter();
}
document.getElementById('closePanel').onclick=clearFocus;
document.addEventListener('keydown',e=>{if(e.key==='Escape')clearFocus();});

const offCats=new Set();
function applyFilter(){
  edgeEls.forEach(e=>{const off=offCats.has(e.cat);
    e.g.classList.toggle('hide',off); e.lg.classList.toggle('hide',off);});
}

/* ---------------- zoom / pan ---------------- */
const svg=document.getElementById('svg'),vp=document.getElementById('viewport'),stage=document.getElementById('stage');
let k=1,tx=0,ty=0;
const apply=()=>vp.setAttribute('transform',`translate(${tx} ${ty}) scale(${k})`);
const toVB=(cx,cy)=>{const p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(svg.getScreenCTM().inverse());};
function zoomAt(px,py,f){const nk=Math.min(5,Math.max(.3,k*f)),r=nk/k;
  tx=px-(px-tx)*r; ty=py-(py-ty)*r; k=nk; apply();}
stage.addEventListener('wheel',e=>{e.preventDefault();const p=toVB(e.clientX,e.clientY);
  zoomAt(p.x,p.y,Math.exp(-e.deltaY*0.0015));},{passive:false});

let drag=null;
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.node'))return;
  drag={x:e.clientX,y:e.clientY,tx,ty,moved:false};
  stage.setPointerCapture(e.pointerId); stage.classList.add('grabbing');});
stage.addEventListener('pointermove',e=>{
  if(!drag)return;
  const r=svg.getBoundingClientRect();
  const u=Math.max(3080/r.width,2400/r.height);
  tx=drag.tx+(e.clientX-drag.x)*u; ty=drag.ty+(e.clientY-drag.y)*u;
  if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4)drag.moved=true;
  apply();});
stage.addEventListener('pointerup',()=>{if(drag&&!drag.moved)clearFocus();drag=null;stage.classList.remove('grabbing');});
stage.addEventListener('pointercancel',()=>{drag=null;stage.classList.remove('grabbing');});

const pts=new Map(); let pd=0;
stage.addEventListener('pointerdown',e=>pts.set(e.pointerId,e));
stage.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return; pts.set(e.pointerId,e);
  if(pts.size===2){drag=null;
    const [a,b]=[...pts.values()];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(pd){const p=toVB((a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2);zoomAt(p.x,p.y,d/pd);}
    pd=d;}});
['pointerup','pointercancel','pointerleave'].forEach(t=>
  stage.addEventListener(t,e=>{pts.delete(e.pointerId);if(pts.size<2)pd=0;}));

document.getElementById('zin').onclick=()=>zoomAt(1600,1240,1.25);
document.getElementById('zout').onclick=()=>zoomAt(1600,1240,.8);
document.getElementById('reset').onclick=()=>{k=1;tx=0;ty=0;apply();clearFocus();};
const tl=document.getElementById('togLabel');
tl.onclick=()=>{const on=gLabels.style.display!=='none';gLabels.style.display=on?'none':'';tl.classList.toggle('off',on);};
apply();
</script>
