const PINKBUBBLE = new Set(['romance']);

const NODES = [
  /* ================= 主角 ================= */
  {id:'yuan', g:'遠', name:'陳遠（遠子・遠哥）', role:'天一醫藥集團　戰略規劃部並購交易總監', era:'二十八歲　成都 → 北京', x:1900, y:1400, lead:true,
   facts:['眉山人，家中獨子，父母都是公務員。川大金融系畢業後直接進天一，六年做到並購部總監。',
          '收購久元藥廠是他升總監後的第一個大案，拿到約一百萬的項目激勵獎金。',
          '被總經理與王雲彪點將，常駐北京主攻安拓 HBV-201 全球權益，預估獎金超過兩千萬。',
          '習慣：進門先挑角落背牆、面對門口的位子；出差必游泳健身；思考時抽菸；喜歡在水裡想事情。',
          '全書以他的第一人稱敘述——而這份文稿，二十多年後被他兒子在一個加密資料夾裡打開。',
          '〈關於〉一節裡作者的評語：工作上十分優秀，性格卻偏於懦弱，不知取捨，不懂珍惜，對心愛的人沒有包容，最後追悔莫及。']},

  /* ================= 楔子與後記 ================= */
  {id:'chongfei', g:'飛', name:'陳重飛', role:'深圳建築設計院設計師・陳遠之子', era:'四十年後　成都 → 杭州', x:280, y:260,
   facts:['父親心梗過世，他從深圳飛回成都辦後事，在錦官園養老院清理遺物。',
          '木頭盒子裡只剩兩個鑲在鏡框裡的泥人生肖：一隻羊，一隻猴。父親屬羊，母親屬猴。',
          '羊生肖鏡框背面貼著一張淺黃便條，上面是父親手書的一個 157 開頭的手機號碼——寫 7 字中間加一橫。',
          '這串號碼正是那個從未取名的加密資料夾的密碼。裡面只有一個文檔。',
          '後記：他在杭州香格里拉旁的咖啡店見到一位溫婉的中年女士，「我姓陳，請問怎麼稱呼？」——他忽然覺得莫名親切。']},
  {id:'mystery', g:'謎', name:'那位姓陳的女士', role:'杭州咖啡店的赴約者', era:'後記', x:260, y:660,
   facts:['157 號碼的主人：「還是原主，我不常用這個手機號。」',
          '面談地點是她定的：杭州香格里拉酒店右手邊的咖啡店，週六早上十點。',
          '媚姐曾在電話最後猶豫著留給陳遠另一個號碼，說唐櫻留了一樣東西和他有關——「不過唐櫻不希望我說。」',
          '陳遠思前想後，決定尊重她的選擇，始終沒有打。這個電話，最後由他的兒子打通。']},

  /* ================= 眉山老家 ================= */
  {id:'mom', g:'母', name:'陳遠的媽媽', role:'眉山縣公務員・全書最強的催婚火力', era:'全篇', x:660, y:220,
   facts:['「這姑娘是我參加工作時的老大姐介紹的，你們成不成我不管，別丟了老陳家的面子。」',
          '上一個安排的相親對象是拿新加坡護照、只能聽懂他半句話的華僑——理由是「新加坡是發達國家，挺好」。',
          '風聞北京的事後打來一通電話：「你太爺爺是上了紅榜的舉人，你姥爺 19 歲參加革命……」',
          '「如果這世界上還有一個人能管得住我，那就是我媽。」']},
  {id:'dad', g:'父', name:'陳遠的爸爸', role:'眉山縣公務員・血壓高', era:'全篇', x:1020, y:300,
   facts:['戲份極少，卻是媽媽最有力的武器：「你爸血壓高，你要敢幹出點啥出格的事把你爸弄醫院裡了……」',
          '四十年後，他成了錦官園養老院裡那位滴酒不沾、只留下兩個泥人生肖的老人。']},
  {id:'mengliang', g:'良', name:'趙孟良（孟良）', role:'高中同班・跟大哥跑成都—上海長途貨運', era:'全篇　最沉的一筆', x:640, y:600,
   facts:['大個子，比他哥高一個頭，駕駛艙睡不直，只能把兩隻腳伸出車窗外。',
          '請客時掏出一疊老人頭：「猜猜，我這趟掙了多少？三千！」——大部分都進了女朋友管著的婚禮專項基金。',
          '在上海松江卸貨時被陳遠找上，答應把那個 U 盤帶回成都交給何萍萍，並提前出發。',
          '車到成都的紅綠燈路口為閃避違規摩托車翻覆，被對向大貨撞上。右肢截斷。',
          '後來進父母的廠當門衛，工資不高但穩定；五一和女朋友結了婚。陳遠沒有去，只轉了 88888 塊。',
          '「孟良的人生軌跡已經被徹底改寫，而我就是那個罪魁禍首。」']},
  {id:'mengbro', g:'兄', name:'孟良的大哥', role:'長途貨運司機・後改開縣城出租車', era:'車禍前後', x:560, y:940,
   facts:['知道弟弟受託的事，直接用弟弟的手機聯繫了何萍萍，把 U 盤送到。',
          '事後轉述車禍經過時語氣古井不波，「像是在講述別人的故事」。',
          '王東亮打了兩萬塊給他。陳遠塞了一張二十萬的銀行卡給大嫂，說是孟良寄放的私房錢。']},
  {id:'pangzi', g:'胖', name:'胖子', role:'縣電廠檢線員・高中同班', era:'全篇', x:1000, y:700,
   facts:['一點也不胖，瘦瘦精精的一個人——小時候身體不好打補針，虛胖過一陣，外號就留下了。',
          '「咱們班同學中就你和東亮混出來了，這頓你得請。」',
          '帶著哭腔打來那通電話：「孟良出車禍了，上海回來的路上。」那天北京下了入冬第一場雪。']},

  /* ================= 京城關係網 ================= */
  {id:'hongmian', g:'洪', name:'洪勉', role:'前發改委洪副主任的小兒子・中齊集團董事長', era:'京城太子', x:1200, y:1020,
   facts:['Prada 墨鏡、粉紅 Polo 立領、TODS 豆豆鞋。他一進門，有實權的處長司長都要讓出主位。',
          '服務員打翻湯碗那晚，王東亮多此一舉替人賠罪，被他當場刺回：「王處，眼鏡度數不夠了吧？」',
          '不打不相識，此後打高爾夫也叫上王東亮——王東亮總覺得「這裡面沒那麼簡單」。',
          '「川人」計畫真正遞刀的那隻手：他找上王東亮，給了兩百萬。']},
  {id:'ouyangsi', g:'歐', name:'歐陽司長', role:'衛生部・王東亮的上級', era:'湘鄂情飯局', x:560, y:1300,
   facts:['名片是典型國家機關統一印發的樣式，連手機號碼都沒有，只有單位座機。',
          '整晚和洪勉輕聲耳語，時不時點頭，像是拿到了什麼錦囊妙計。',
          '湯碗打翻那一刻，是他丟給王東亮那個要他出面賠罪的眼色。']},
  {id:'machu', g:'馬', name:'馬處長', role:'藥監局', era:'湘鄂情飯局', x:600, y:1660,
   facts:['和宏達那一局：一宴幾局，各談各的行政手續。',
          '飯後要去 KTV 時，他和歐陽司長都找了藉口推辭——考慮到身份，意料之中。']},
  {id:'linkui', g:'林', name:'林奎（林總）', role:'北京宏達醫療器械進出口公司副總經理', era:'京城飯局', x:980, y:1360,
   facts:['機靈，會打圓場：洪勉臉色鐵青那一刻，是他先說了幾句軟話。',

  {id:'dujianguo', g:'杜', name:'杜建國（小杜）', role:'宏達業務經理', era:'京城飯局', x:1000, y:1740,
   facts:['林總的下屬，負責在酒桌上給馬處長敬酒。',
          '王東亮被洪勉刺那一刻，笑話他的人裡也有小杜。']},

  /* ================= 天一醫藥集團 ================= */
  {id:'wangyunbiao', g:'彪', name:'王雲彪（雲彪總）', role:'天一集團戰略規劃部副總經理・陳遠的伯樂', era:'全篇 → 被解聘', x:1700, y:480,
   facts:['部隊轉業後在清華讀工商管理，十年前加入天一負責企業戰略規劃，趕上天一轉型的關鍵期。',
          '六年前在數百份履歷裡挑中剛畢業的陳遠。「不知什麼原因」——這句話後來成了整本書的伏筆之一。',
          '「這個項目的任何情況只向我和李總匯報，集團公司任何其他人都不要說明。」',
          '陳遠潛伏後海那個月，他破天荒打電話問吳自江「知不知道陳遠在哪裡」——卻從不直接問陳遠。',
          '天一整體出售啟動後，29 樓的副總們陸續被請走，他是第一個。用一張快遞來的手機卡跟陳遠通了最後一次電話。',

const VBW=4100, VBH=2900;
const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));
const el=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const gStars=document.getElementById('stars'),gGlow=document.getElementById('glows'),
      gEdges=document.getElementById('edges'),gLabels=document.getElementById('labels'),
      gNodes=document.getElementById('nodes');

let seed=29;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
for(let i=0;i<620;i++)
  gStars.appendChild(el('circle',{cx:(rnd()*4400-160).toFixed(1),cy:(rnd()*3200-160).toFixed(1),
    r:(rnd()*1.7+.3).toFixed(2),fill:'#dbeaff','fill-opacity':(rnd()*.7+.15).toFixed(2)}));

/* kind: lead=主角  rom=情感對象（粉紅泡泡）  key=非情感的關口  norm=其他 */
const KIND=n=>n.lead?'lead':(n.romance?'rom':(n.gate?'key':'norm'));
NODES.forEach(n=>{
  const k=KIND(n);
  if(k==='lead') gGlow.appendChild(el('circle',{cx:n.x,cy:n.y,r:215,fill:'url(#halo)'}));
  else if(k==='rom') gGlow.appendChild(el('circle',{cx:n.x,cy:n.y,r:168,fill:'url(#haloGate)'}));
  else if(k==='key') gGlow.appendChild(el('circle',{cx:n.x,cy:n.y,r:158,fill:'url(#haloKey)'}));
});

const R=n=>n.lead?64:((n.romance||n.gate)?54:42);
const tw=(s,fs)=>[...s].reduce((a,c)=>a+(/[\x00-\xff]/.test(c)?fs*.56:fs*1.02),0);
const nameFS=n=>n.lead?25:((n.romance||n.gate)?23:19);

/* obstacles: node discs + their caption boxes */
const obstacles=[];
NODES.forEach(n=>{
  const r=R(n);
  obstacles.push({x:n.x-r,y:n.y-r,w:2*r,h:2*r});
  const w1=tw(n.name,nameFS(n))+8, w2=tw(n.role,13.5)+8;
  obstacles.push({x:n.x-w1/2,y:n.y+r+12,w:w1,h:22});
  obstacles.push({x:n.x-w2/2,y:n.y+r+34,w:w2,h:19});
});
const ov=(a,b)=>Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*
                Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));

const placed=[], edgeEls=[], nodeEls={}, adj={};
NODES.forEach(n=>adj[n.id]=[]);

const bez=(p0,p1,p2,t)=>({x:(1-t)*(1-t)*p0.x+2*(1-t)*t*p1.x+t*t*p2.x,
                          y:(1-t)*(1-t)*p0.y+2*(1-t)*t*p1.y+t*t*p2.y});

/* longest edges first — they have the most room to negotiate */
const order=EDGES.map((e,i)=>{const s=byId[e[0]],t=byId[e[1]];
  return {i,len:Math.hypot(t.x-s.x,t.y-s.y)};}).sort((a,b)=>b.len-a.len).map(o=>o.i);

const geo=EDGES.map(e=>{
  const s=byId[e[0]],t=byId[e[1]];
  const dx=t.x-s.x,dy=t.y-s.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const p0={x:s.x+ux*(R(s)+7),y:s.y+uy*(R(s)+7)};
  const p2={x:t.x-ux*(R(t)+14),y:t.y-uy*(R(t)+14)};
  const m={x:(p0.x+p2.x)/2,y:(p0.y+p2.y)/2};
  const c=e[4]||0;
  return {p0,p1:{x:m.x-uy*L*c*2,y:m.y+ux*L*c*2},p2,ux,uy,L};
});

order.forEach(i=>{
  const [sid,tid,label,cat,curve,flag]=EDGES[i];
  const {p0,p1,p2,ux,uy}=geo[i];
  const col=CAT[cat].c, main=(flag==='main'||flag==='maindash');
  const w=tw(label,13.5)+20, h=24;

  /* pick the least-colliding spot along the curve */
  let best=null;
  const ts=[.5,.42,.58,.34,.66,.28,.72,.24,.76,.2,.8];
  for(const t of ts){
    for(const off of [0,-17,17,-32,32,-48,48]){
      const q=bez(p0,p1,p2,t);
      const box={x:q.x-uy*off-w/2,y:q.y+ux*off-h/2,w,h};
      let sc=0;
      obstacles.forEach(o=>sc+=ov(box,o)*1.4);
      placed.forEach(o=>sc+=ov(box,o)*2.2);
      sc+=Math.abs(t-.5)*260+Math.abs(off)*3;
      if(!best||sc<best.sc)best={sc,box,q:{x:q.x-uy*off,y:q.y+ux*off},anchor:q};
    }
  }
  placed.push(best.box);

  const g=el('g',{class:'edgegrp'});
  const bw0=main?5:2.2, bo0=main?.95:.62;
  const p=el('path',{class:'edge',d:`M${p0.x.toFixed(1)},${p0.y.toFixed(1)} Q${p1.x.toFixed(1)},${p1.y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`,
    stroke:col,'stroke-width':bw0,'stroke-opacity':bo0});
  if(flag==='dash')p.setAttribute('stroke-dasharray','9 8');
  if(flag==='maindash')p.setAttribute('stroke-dasharray','0.1 16');
  const ax=p2.x-p1.x, ay=p2.y-p1.y, aL=Math.hypot(ax,ay)||1, vx=ax/aL, vy=ay/aL;
  g.append(p, el('path',{d:`M${p2.x},${p2.y} L${(p2.x-vx*15-vy*6.5).toFixed(1)},${(p2.y-vy*15+vx*6.5).toFixed(1)} L${(p2.x-vx*15+vy*6.5).toFixed(1)},${(p2.y-vy*15-vx*6.5).toFixed(1)} Z`,
    fill:col,'fill-opacity':.9}));
  gEdges.appendChild(g);

  const lg=el('g',{class:'edgelab'});
  const q=best.q, a=best.anchor;
  if(Math.hypot(q.x-a.x,q.y-a.y)>3)
    lg.appendChild(el('line',{class:'leader',x1:a.x.toFixed(1),y1:a.y.toFixed(1),x2:q.x.toFixed(1),y2:q.y.toFixed(1),stroke:col}));
  lg.appendChild(el('rect',{x:(q.x-w/2).toFixed(1),y:(q.y-h/2).toFixed(1),width:w.toFixed(1),height:h,rx:12,
    fill:(main||PINKBUBBLE.has(cat))?'#ffdcee':'#d3e2f9',stroke:col,'stroke-width':main?1.8:1.1,'stroke-opacity':.85}));
  const tx=el('text',{class:'elabel',x:q.x.toFixed(1),y:(q.y+.5).toFixed(1)});
  tx.textContent=label; lg.appendChild(tx);
  gLabels.appendChild(lg);

  edgeEls[i]={g,lg,sid,tid,cat,label,path:p,bw0,bo0};
  adj[sid].push({other:tid,label,cat});
  adj[tid].push({other:sid,label,cat});
});

NODES.forEach(n=>{
  const r=R(n);
  const g=el('g',{class:'node',tabindex:'0',role:'button','aria-label':n.name});
  const k=KIND(n);
  const SK={lead:{aur:'#7fb2ff',ao:.18,face:'url(#faceLead)',ring:'#ffd07a',rw:3.5,fs:42},
            rom :{aur:'#ff86bd',ao:.15,face:'url(#faceGate)',ring:'#ff9ecb',rw:3.2,fs:36},
            key :{aur:'#ffc46a',ao:.13,face:'url(#faceKey)', ring:'#ffcf7a',rw:3,  fs:36},
            norm:{aur:'#7fb2ff',ao:.08,face:'url(#face)',    ring:'#5f93d8',rw:2,  fs:30}}[k];
  g.appendChild(el('circle',{cx:n.x,cy:n.y,r:r+16,fill:SK.aur,'fill-opacity':SK.ao}));
  g.appendChild(el('circle',{class:'ring',cx:n.x,cy:n.y,r:r,fill:SK.face,stroke:SK.ring,'stroke-width':SK.rw}));
  const gl=el('text',{class:'glyph',x:n.x,y:n.y,'font-size':SK.fs});
  gl.textContent=n.g; g.appendChild(gl);
  const nm=el('text',{class:'nname',x:n.x,y:n.y+r+28,'font-size':nameFS(n)});
  nm.textContent=n.name; g.appendChild(nm);
  const rl=el('text',{class:'nrole',x:n.x,y:n.y+r+48});
  rl.textContent=n.role; g.appendChild(rl);
  const btxt=n.lead?'主角':(n.gate||(n.romance?'情':''));
  if(btxt){
    const bw=btxt.length<=1?34:52;
    const bg=n.lead?'#f0904a':(n.romance?'#c2427f':'#a86a1c');
    const bs=n.lead?'#ffd7b0':(n.romance?'#ffbedb':'#ffdca8');
    g.appendChild(el('rect',{x:n.x+r-bw/2+8,y:n.y+r-22,width:bw,height:30,rx:15,
      fill:bg,stroke:bs,'stroke-width':1.5}));
    const b=el('text',{x:n.x+r+8,y:n.y+r-7,'font-size':n.lead?14:13.5,fill:'#fff','font-weight':800,
      'text-anchor':'middle','dominant-baseline':'central'});
    b.textContent=btxt; g.appendChild(b);
  }
  g.addEventListener('click',ev=>{ev.stopPropagation();focusNode(n.id);});
  g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();focusNode(n.id);}});
  gNodes.appendChild(g); nodeEls[n.id]=g;
});

/* ---------------- legend ---------------- */
const lg=document.getElementById('legend');
const legItems={};
Object.keys(CAT).forEach(k=>{
  const b=document.createElement('button');
  b.className='legitem'; b.type='button';
  b.innerHTML='<i style="background:'+CAT[k].c+'"></i>'+CAT[k].name+
              '<b>'+EDGES.filter(e=>e[3]===k).length+'</b>';
  b.title='點擊：highlight 這一類的全部關係線';
  b.onclick=ev=>{ev.stopPropagation();highlightCat(k);};
  lg.appendChild(b); legItems[k]=b;
});

/* ---------------- focus + panel ---------------- */
const panel=document.getElementById('panel');
function focusNode(id){
  activeCat=null;
  Object.values(legItems).forEach(b=>b.classList.remove('on'));
  resetStrokes();
  const keep=new Set([id,...adj[id].map(a=>a.other)]);
  NODES.forEach(n=>nodeEls[n.id].classList.toggle('faded',!keep.has(n.id)));
  edgeEls.forEach(e=>{const on=e.sid===id||e.tid===id;
    e.g.classList.toggle('faded',!on); e.lg.classList.toggle('faded',!on);});
  const n=byId[id];
  document.getElementById('pName').textContent=n.name;
  document.getElementById('pRole').textContent=n.role;
  document.getElementById('pEra').textContent=n.era||'';
  const ul=document.getElementById('pFacts'); ul.innerHTML='';
  n.facts.forEach(f=>{const li=document.createElement('li');li.textContent=f;ul.appendChild(li);});
  const rd=document.getElementById('pRels'); rd.innerHTML='';
  adj[id].forEach(a=>{
    const d=document.createElement('div'); d.className='rel';
    d.innerHTML='<span class="bar" style="background:'+CAT[a.cat].c+'"></span>'+
      '<span class="who">'+byId[a.other].name+'</span><span class="what">・'+a.label+'</span>';
    d.onclick=()=>focusNode(a.other); rd.appendChild(d);
  });
  panel.classList.add('open'); panel.scrollTop=0;
}
function clearFocus(){
  panel.classList.remove('open');
  activeCat=null;
  if(typeof legItems!=='undefined')Object.values(legItems).forEach(b=>b.classList.remove('on'));
  NODES.forEach(n=>nodeEls[n.id].classList.remove('faded'));
  edgeEls.forEach(e=>{e.g.classList.remove('faded');e.lg.classList.remove('faded');});
  resetStrokes();
}
document.getElementById('closePanel').onclick=clearFocus;
document.addEventListener('keydown',e=>{if(e.key==='Escape')clearFocus();});

let activeCat=null;
function resetStrokes(){
  edgeEls.forEach(e=>{e.path.setAttribute('stroke-width',e.bw0);
                      e.path.setAttribute('stroke-opacity',e.bo0);});
}
function highlightCat(k){
  if(activeCat===k){clearFocus();return;}
  activeCat=k;
  Object.keys(legItems).forEach(j=>legItems[j].classList.toggle('on',j===k));
  const keep=new Set();
  edgeEls.forEach(e=>{
    const on=e.cat===k;
    e.g.classList.toggle('faded',!on); e.lg.classList.toggle('faded',!on);
    e.path.setAttribute('stroke-width',on?Math.max(e.bw0*1.9,4.6):e.bw0);
    e.path.setAttribute('stroke-opacity',on?1:e.bo0);
    if(on){keep.add(e.sid);keep.add(e.tid);}
  });
  NODES.forEach(n=>nodeEls[n.id].classList.toggle('faded',!keep.has(n.id)));
  const rel=edgeEls.filter(e=>e.cat===k);
  document.getElementById('pName').textContent=CAT[k].name;
  document.getElementById('pRole').textContent=rel.length+' 條關係　·　'+keep.size+' 位人物';
  document.getElementById('pEra').textContent='關係類別　·　再點一次圖例即可取消';
  document.getElementById('pFacts').innerHTML='';
  const rd=document.getElementById('pRels'); rd.innerHTML='';
  rel.forEach(e=>{
    const d=document.createElement('div'); d.className='rel';
    d.innerHTML='<span class="bar" style="background:'+CAT[k].c+'"></span>'+
      '<span class="who">'+byId[e.sid].name+' → '+byId[e.tid].name+'</span>'+
      '<span class="what">・'+e.label+'</span>';
    d.onclick=()=>focusNode(e.sid==='afa'?e.tid:e.sid);
    rd.appendChild(d);
  });
  panel.classList.add('open'); panel.scrollTop=0;
}

/* ---------------- zoom / pan ---------------- */
const svg=document.getElementById('svg'),vp=document.getElementById('viewport'),stage=document.getElementById('stage');
let k=1,tx=0,ty=0;
const apply=()=>vp.setAttribute('transform',`translate(${tx} ${ty}) scale(${k})`);
const toVB=(cx,cy)=>{const p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(svg.getScreenCTM().inverse());};
function zoomAt(px,py,f){const nk=Math.min(6,Math.max(.25,k*f)),r=nk/k;
  tx=px-(px-tx)*r; ty=py-(py-ty)*r; k=nk; apply();}
stage.addEventListener('wheel',e=>{e.preventDefault();const p=toVB(e.clientX,e.clientY);
  zoomAt(p.x,p.y,Math.exp(-e.deltaY*0.0015));},{passive:false});

let drag=null;
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.node'))return;
  drag={x:e.clientX,y:e.clientY,tx,ty,moved:false};
  stage.setPointerCapture(e.pointerId); stage.classList.add('grabbing');});
stage.addEventListener('pointermove',e=>{
  if(!drag)return;
  const r=svg.getBoundingClientRect();
  const u=Math.max(VBW/r.width,VBH/r.height);
  tx=drag.tx+(e.clientX-drag.x)*u; ty=drag.ty+(e.clientY-drag.y)*u;
  if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4)drag.moved=true;
  apply();});
stage.addEventListener('pointerup',()=>{if(drag&&!drag.moved)clearFocus();drag=null;stage.classList.remove('grabbing');});
stage.addEventListener('pointercancel',()=>{drag=null;stage.classList.remove('grabbing');});

const pts=new Map(); let pd=0;
stage.addEventListener('pointerdown',e=>pts.set(e.pointerId,e));
stage.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return; pts.set(e.pointerId,e);
  if(pts.size===2){drag=null;
    const [a,b]=[...pts.values()];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(pd){const p=toVB((a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2);zoomAt(p.x,p.y,d/pd);}
    pd=d;}});
['pointerup','pointercancel','pointerleave'].forEach(t=>
  stage.addEventListener(t,e=>{pts.delete(e.pointerId);if(pts.size<2)pd=0;}));

document.getElementById('zin').onclick=()=>zoomAt(VBW/2,VBH/2,1.25);
document.getElementById('zout').onclick=()=>zoomAt(VBW/2,VBH/2,.8);
document.getElementById('reset').onclick=()=>{k=1;tx=0;ty=0;apply();clearFocus();};
const tl=document.getElementById('togLabel');
tl.onclick=()=>{const on=gLabels.style.display!=='none';gLabels.style.display=on?'none':'';tl.classList.toggle('off',on);};
apply();
</script>
